version: '3.8'

services:
  # App Backend & Frontend (Node.js + Express + Vite)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optavia_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/optavia_db
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      - db

  # Banco de Dados PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: optavia_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: optavia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
